name: CI Develop Branch

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: semver
        run: |
          git fetch --tags

          LATEST_TAG=$(git tag --merged origin/main | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -Eq "BREAKING CHANGE|!|feat!:|fix!:|chore!:|docs!:|style!:|refactor!:|perf!:|test!:|build!:|ci!:|revert!:"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -q "^feat:"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEXT_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "Next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Create Release Branch and PR
        run: |
          NEXT_VERSION=${{ steps.semver.outputs.version }}
          RELEASE_BRANCH="release/${NEXT_VERSION#v}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          if ! git rev-parse --verify "origin/$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "Creating release branch $RELEASE_BRANCH from main..."
            git push origin origin/main:refs/heads/"$RELEASE_BRANCH"
          else
            echo "Release branch $RELEASE_BRANCH already exists."
          fi
          git fetch origin "$RELEASE_BRANCH"

          COMMITS_COUNT=$(git rev-list --count origin/"$RELEASE_BRANCH"..HEAD)

          if [ "$COMMITS_COUNT" -eq 0 ]; then
            echo "No new commits between develop and $RELEASE_BRANCH. Skipping PR creation."
            exit 0
          fi

          PR_EXISTS=$(gh pr list --head develop --base "$RELEASE_BRANCH" --json number --jq 'length > 0')

          if [ "$PR_EXISTS" = "false" ]; then
            gh pr create \
              --title "Release $NEXT_VERSION" \
              --body "Automated release PR from develop to $RELEASE_BRANCH." \
              --base "$RELEASE_BRANCH" \
              --head develop
          else
            echo "PR already exists from develop to $RELEASE_BRANCH."
          fi
