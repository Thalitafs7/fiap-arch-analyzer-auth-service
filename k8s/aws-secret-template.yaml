# TEMPLATE — do NOT commit real values.
#
# This file documents the shape of the Kubernetes Secret `ms-auth-secret`
# that is materialised at deploy time by the `secrets-sync` init container
# (see deployment.yaml).  The init container fetches `arch-analyzer/auth/mongo`
# from AWS Secrets Manager using the node's LabRole credentials (IMDS) and
# writes the values into the in-memory emptyDir volume; a post-start hook or
# the orchestrator then creates / patches this Secret from that data.
#
# AWS credentials (region, access key, session token) are NOT stored here;
# they are injected at runtime via the `infra-outputs` ConfigMap
# (AWS_REGION, AWS_ACCOUNT_ID) and the node's instance profile.
#
# To create the secret manually for local testing:
#   kubectl create secret generic ms-auth-secret \
#     --namespace auth \
#     --from-literal=MONGO_CONNECTION_STRING='mongodb://user:pass@mongodb.data.svc.cluster.local:27017/auth_db' \
#     --from-literal=Jwt__Key='<signing-key-min-32-chars>' \
#     --from-literal=Security__XInternalKey='<internal-api-key>'
apiVersion: v1
kind: Secret
metadata:
  name: ms-auth-secret
  namespace: auth
  labels:
    app.kubernetes.io/name: ms-auth
    app.kubernetes.io/part-of: arch-analyzer
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # MongoDB connection string — sourced from arch-analyzer/auth/mongo in Secrets Manager
  MONGO_CONNECTION_STRING: "REPLACE_AT_DEPLOY_TIME"

  # JWT signing key — sourced from arch-analyzer/auth/jwt in Secrets Manager
  Jwt__Key: "REPLACE_AT_DEPLOY_TIME"

  # Internal service-to-service API key
  Security__XInternalKey: "REPLACE_AT_DEPLOY_TIME"
