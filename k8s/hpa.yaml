apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-auth-hpa
  namespace: auth
  labels:
    app.kubernetes.io/name: ms-auth
    app.kubernetes.io/part-of: arch-analyzer
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-auth-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
