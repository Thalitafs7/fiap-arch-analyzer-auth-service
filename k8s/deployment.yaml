apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auth-api
  namespace: auth
  labels:
    app.kubernetes.io/name: ms-auth
    app.kubernetes.io/part-of: arch-analyzer
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ms-auth-api
  template:
    metadata:
      labels:
        app: ms-auth-api
        app.kubernetes.io/name: ms-auth
        app.kubernetes.io/part-of: arch-analyzer
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000

      volumes:
        - name: secrets-vol
          emptyDir:
            medium: Memory

      initContainers:
        - name: secrets-sync
          image: amazon/aws-cli:2.15.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              SECRET=$(aws secretsmanager get-secret-value \
                --secret-id arch-analyzer/auth/mongo \
                --query SecretString \
                --output text)
              echo "$SECRET" > /secrets/mongo.json
          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: ms-auth-api
          image: arch-analyzer-auth:latest
          # Image resolved at deploy time via kustomization.yaml images override:
          #   newName: ${ECR_REGISTRY}/arch-analyzer-auth
          #   newTag:  ${IMAGE_TAG}
          ports:
            - containerPort: 5002

          envFrom:
            - configMapRef:
                name: infra-outputs
            - configMapRef:
                name: ms-auth-config
            - secretRef:
                name: ms-auth-secret

          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
